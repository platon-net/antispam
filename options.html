<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="/css/options.css" type="text/css" charset="utf-8" />
</head>
<body>
	<div class="options-wrap">
		<div class="settings-section">
			<h2>__MSG_apiSettings__</h2>
			<div class="options-grid">
				<div class="setting-row">
					<label class="setting-label" for="api_endpoint_url">__MSG_apiEndpointURL__</label>
					<div class="setting-control">
						<input type="text" id="api_endpoint_url">
					</div>
				</div>

				<div class="setting-row">
					<label class="setting-label" for="api_token">__MSG_apiToken__</label>
					<div class="setting-control">
						<input type="text" id="api_token">
					</div>
				</div>
			</div>
		</div>
		<hr>

		<div class="settings-section">
			<h2>__MSG_webserviceSettings__</h2>
			<div class="options-grid">
				<div class="setting-row">
					<label class="setting-label" for="webservice_endpoint_url">__MSG_webserviceEndpointURL__</label>
					<div class="setting-control">
						<input type="text" id="webservice_endpoint_url">
					</div>
				</div>

				<div class="setting-row">
					<label class="setting-label" for="webservice_token">__MSG_webserviceToken__</label>
					<div class="setting-control">
						<input type="text" id="webservice_token">
					</div>
				</div>
			</div>
		</div>
		<hr>

		<div class="settings-section">
			<h2>__MSG_generalSettings__</h2>
			<div class="options-grid">
				<div class="setting-row">
					<label class="setting-label" for="backend_type">__MSG_backendType__</label>
					<div class="setting-control">
						<select id="backend_type">
							<option value="api">__MSG_useApi__</option>
							<option value="webservice">__MSG_useWebservice__</option>
						</select>
					</div>
				</div>

				<div class="setting-row">
					<label class="setting-label" for="reload_popup">__MSG_reloadPopup__</label>
					<div class="setting-control">
						<select id="reload_popup">
							<option value="1">__MSG_yes__</option>
							<option value="0">__MSG_no__</option>
						</select>
					</div>
				</div>

				<div class="setting-row">
					<label class="setting-label" for="popup_focused">__MSG_popupFocused__</label>
					<div class="setting-control">
						<select id="popup_focused">
							<option value="1">__MSG_yes__</option>
							<option value="0">__MSG_no__</option>
						</select>
					</div>
				</div>
			</div>
		</div>

		<div class="actions-row">
			<span id="antispam_label_save" class="hide">__MSG_saveLabel__</span>
			<button id="antispam_button_save">__MSG_save__</button>
		</div>
	</div>

</body>
<script type="module" src="options.js"></script>
<script type="text/javascript" src="i18n.js"></script>
</html>
